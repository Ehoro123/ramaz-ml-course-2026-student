[project]
name = "hw03-linear-logistic-regression"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

# On Linux (the Gradescope container), pull CPU-only torch wheels — much
# smaller than the default CUDA build. macOS/Windows keep the default index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-json-report>=1.5",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
markers = [
    "methods: individual method tests (40 pts)",
    "pipeline: full fit/predict end-to-end (30 pts)",
    "experiments: analysis.py helpers (20 pts)",
]
addopts = "-v --tb=short --strict-markers"
timeout = 30
